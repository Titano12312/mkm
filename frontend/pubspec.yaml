name: tellaviv
description: TellAviv — private Discord-like messenger (Windows + Android).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  socket_io_client: ^2.0.3
  flutter_webrtc: ^1.6.1
  provider: ^6.1.2
  uuid: ^4.4.0
  supabase_flutter: ^2.17.2
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

# Launcher icons (Android + Windows). Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  windows:
    generate: true
    image_path: "assets/icon-src.png"
    icon_size: 256
  image_path: "assets/icon-src.png"
  adaptive_icon_background: "#FF5757"
  adaptive_icon_foreground: "assets/icon-src.png"
